const FB={apiKey:"AIzaSyCCn8ymvIoGTzGi4Ufi99AWiqJPDQsm9vI",authDomain:"wedding-584ba.firebaseapp.com",databaseURL:"https://wedding-584ba-default-rtdb.europe-west1.firebasedatabase.app",projectId:"wedding-584ba",storageBucket:"wedding-584ba.firebasestorage.app",messagingSenderId:"53535551162",appId:"1:53535551162:web:a05dcad27a2733c7161c83"};
/* ===== Ende der Konfiguration ===== */
function initDb(){if(!FB.databaseURL||FB.databaseURL.startsWith('DEINE')||typeof firebase==='undefined')return null;firebase.initializeApp(FB);const r=firebase.database();return{doc:p=>({set:o=>r.ref(p).set(o),onSnapshot:(cb,er)=>r.ref(p).on('value',s=>cb({exists:s.exists(),data:()=>s.val()}),er)})}}
const D={};let page='home',sub='todos',db=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cf=k=>k=='contacts'?CON:k=='budget'?BUD:S[k],evk=()=>EV[page][0];
function save(k){if(db)db.doc('wedding/'+k).set({items:D[k]}).catch(()=>{$('note').textContent='Speichern nicht möglich – bitte Internet und Firebase-Regeln prüfen.'})}
function rows(k,list,filt){const cfg=cf(k);let h='';(list||[]).forEach((it,i)=>{if(filt&&it.ev!==filt)return;
h+=`<div class="row ${it.done?'done':''}">`+cfg.f.map(([f,ty,ph])=>ty=='check'?`<input type=checkbox data-k="${k}" data-i="${i}" data-f="${f}" ${it[f]?'checked':''}>`:ty=='sel'?`<select data-k="${k}" data-i="${i}" data-f="${f}">${ST.map(s=>`<option ${it[f]==s?'selected':''}>${s}</option>`).join('')}</select>`:`<input type=${ty} data-k="${k}" data-i="${i}" data-f="${f}" placeholder="${ph}" value="${esc(it[f])}">`).join('')+`<button class="x" data-del="${k}" data-i="${i}">×</button></div>`});return h}
const fd=d=>{const t=new Date(d+'T00:00:00');return isNaN(t)?d:t.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'})};
function cd(d){const t=new Date(d+'T00:00:00');if(!d||isNaN(t))return '<p class="note">Datum eintragen, dann startet der Countdown.</p>';const n=Math.round((t-new Date(new Date().toDateString()))/864e5);const f="font:600 56px/1 'Cormorant Garamond',Georgia,serif";return n>0?`<div style="text-align:center;margin-top:12px"><div style="${f}">${n}</div><div class="sub">${n==1?'Tag':'Tage'} bis zum Wedding Day</div></div>`:n==0?`<div style="text-align:center;margin-top:12px;font:600 30px 'Cormorant Garamond',Georgia,serif">Heute ist der Wedding Day 💍</div>`:'<p class="note">Der Wedding Day liegt hinter euch.</p>'}
function vend(){const v=D.vendors||[],cats=[...new Set(v.map(x=>x.cat))];
let h=`<div class="card"><h2>Dienstleister</h2><div class="row"><input id="ncat" list="cl" placeholder="Neue Kategorie (z. B. Fotograf)"><datalist id="cl">${['Location','Fotograf','Videograf','Catering','Musik / DJ','Floristik','Torte','Brautkleid & Anzug','Make-up & Frisur','Deko','Trauringe','Transport'].map(c=>`<option>${c}</option>`).join('')}</datalist><button class="add" style="width:auto;margin:0;padding:8px 16px" data-addcat="1">+</button></div></div>`;
cats.forEach(c=>{h+=`<div class="card"><h2>${esc(c)}</h2>`;v.forEach((x,i)=>{if(x.cat!==c)return;h+=`<div class="row"><input type=text data-k="vendors" data-i="${i}" data-f="n" placeholder="Anbieter" value="${esc(x.n)}"><input type=text data-k="vendors" data-i="${i}" data-f="tel" placeholder="Telefon / E-Mail" value="${esc(x.tel)}"><select style="flex:0 0 74px" data-k="vendors" data-i="${i}" data-f="r">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${+x.r==n?'selected':''}>${n?'★'.repeat(n):'–'}</option>`).join('')}</select><button class="x" data-del="vendors" data-i="${i}">×</button></div>`});
h+=`<button class="add" data-addv="${esc(c)}">+ Anbieter hinzufügen</button></div>`});
return h}
function bud(){const b=D.budget||[],p=b.reduce((s,x)=>s+ +x.plan,0),r=b.reduce((s,x)=>s+ +x.real,0),f=n=>n.toLocaleString('de-DE')+' €';return `<div class="card"><h2>Posten</h2>${rows('budget',b)}<button class="add" data-add="budget">+ Posten hinzufügen</button><div class="sum"><span>Geplant ${f(p)}</span><span>Ist ${f(r)}</span><span>Rest ${f(p-r)}</span></div></div>`}
function pie(){const b=D.budget||[],p=b.reduce((s,x)=>s+ +x.plan,0),r=b.reduce((s,x)=>s+ +x.real,0),f=n=>n.toLocaleString('de-DE')+' €';
if(!p&&!r)return '';
const tot=Math.max(p,r),open=Math.max(p-r,0),C=2*Math.PI*40,sp=r/tot*C,pc=n=>Math.round(n/tot*100)+' %';
return `<div class="card" style="text-align:center"><h2>Budget</h2><svg viewBox="0 0 200 200" width="280" style="max-width:100%" role="img" aria-label="Budget verbraucht und offen"><g transform="rotate(-90 100 100)"><circle cx="100" cy="100" r="40" fill="none" stroke="var(--ol)" stroke-width="80"/><circle cx="100" cy="100" r="40" fill="none" stroke="var(--bd)" stroke-width="80" stroke-dasharray="${sp} ${C}"/></g></svg><div class="sum"><span><b style="color:var(--bd)">●</b> Verbraucht ${f(r)} (${pc(r)})</span><span><b style="color:var(--ol)">●</b> Offen ${f(open)} (${pc(open)})</span></div>${r>p?`<p class="note">Das geplante Budget (${f(p)}) ist um ${f(r-p)} überschritten.</p>`:''}</div>`}
function render(){
$('nav').innerHTML=['home',0,1,2,'budget','vendors'].map(p=>`<button data-page="${p}" class="${p===page?'on':''}">${p==='home'?'Übersicht':p==='budget'?'Budget':p==='vendors'?'Dienstleister':EV[p][1]}</button>`).join('');
let h='';
if(page==='home'){const m=(D.info||[{}])[0]||{};
h=`<div class="card"><h2>Wedding Day</h2><div class="row"><input id="idate" type="date" value="${esc(m.date)}"><input id="iplace" placeholder="Location (folgt)" value="${esc(m.place)}"></div>${cd(m.date)}</div>`;
const b=D.budget||[],p=b.reduce((s,x)=>s+ +x.plan,0),r=b.reduce((s,x)=>s+ +x.real,0),f=n=>n.toLocaleString('de-DE');

h+=`<div class="card"><h2>Auf einen Blick</h2>`+EV.map(e=>{const t=(D.todos||[]).filter(x=>x.ev==e[0]),g=(D.guests||[]).filter(x=>x.ev==e[0]);return `<div class="row"><b style="flex:1">${e[1]}</b><span>${t.filter(x=>!x.done).length} To-dos offen · ${g.filter(x=>x.s=='zugesagt').length}/${g.length} Gäste zugesagt</span></div>`}).join('')+'</div>'}
else if(page==='budget'){h=pie()+bud()}
else if(page==='vendors'){h=vend()}
else{const e=evk();h=`<h2 style="margin:6px 4px">${EV[page][1]}</h2><div class="tiles">${Object.keys(S).map(k=>`<button data-sub="${k}" class="${k==sub?'on':''}">${S[k].t}</button>`).join('')}</div><div class="card"><h2>${S[sub].t}</h2>${rows(sub,D[sub],e)}<button class="add" data-add="${sub}">+ Hinzufügen</button>`;
if(sub=='guests'){const g=(D.guests||[]).filter(x=>x.ev==e);h+=`<div class="sum"><span>${g.filter(x=>x.s=='zugesagt').length} zugesagt</span><span>${g.filter(x=>x.s=='abgesagt').length} abgesagt</span><span>${g.filter(x=>x.s=='offen').length} offen</span></div>`}
h+='</div>'}
$('view').innerHTML=h}
document.addEventListener('click',e=>{const t=e.target;
if(t.dataset.page){page=isNaN(t.dataset.page)?t.dataset.page:+t.dataset.page;render();scrollTo(0,0)}
else if(t.dataset.sub){sub=t.dataset.sub;render()}
else if(t.dataset.add){const k=t.dataset.add;D[k]=[...(D[k]||[]),{...cf(k).add,...(S[k]?{ev:evk()}:{})}];save(k);render()}
else if(t.dataset.addcat){const c=$('ncat').value.trim();if(!c)return;D.vendors=[...(D.vendors||[]),{cat:c,n:'',tel:'',r:0}];save('vendors');render()}
else if(t.dataset.addv){D.vendors=[...(D.vendors||[]),{cat:t.dataset.addv,n:'',tel:'',r:0}];save('vendors');render()}
else if(t.dataset.del){const k=t.dataset.del;D[k]=D[k].filter((_,i)=>i!=t.dataset.i);save(k);render()}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='idate'||t.id=='iplace'){D.info=[{date:$('idate').value,place:$('iplace').value}];save('info');subt();render();return}
if(t.dataset.f){const k=t.dataset.k;D[k][t.dataset.i][t.dataset.f]=t.type=='checkbox'?t.checked:t.value;save(k);render()}});
function subt(){const m=(D.info||[{}])[0]||{};$('sub').textContent='Unsere Hochzeit 2027'+(m.date||m.place?' · '+[fd(m.date),m.place].filter(Boolean).join(' · '):'')}
render();
(async()=>{try{db=initDb()}catch(e){console.error(e)}
if(!db){$('note').textContent='Firebase ist noch nicht eingerichtet – Einträge werden nicht gespeichert. Bitte die Anleitung befolgen.';return}
['todos','guests','budget','seating','timeline','contacts','vendors','info'].forEach(k=>db.doc('wedding/'+k).onSnapshot(s=>{D[k]=s.exists?(s.data().items||[]):[];if(!document.activeElement||!document.activeElement.matches('input,select'))render();subt()},()=>{}))})();
</script></body></html>
